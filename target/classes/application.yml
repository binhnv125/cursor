server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/keyword_extractor}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      # password: ${SPRING_REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: ${DB_TIMEZONE:Asia/Seoul}
  flyway:
    enabled: true

app:
  session:
    ttl: 30m
  enrichment:
    firstPageSize: 20
    concurrency: 8
  worker:
    enabled: true
    redisStream: keyword_enrich_jobs
    consumerGroup: keyword-extractor
    consumerName: ${HOSTNAME:worker-1}
  rateLimit:
    naver:
      globalRps: 200
      perCustomerRps: 20
      acquireTimeoutMs: 3000

anthropic:
  baseUrl: https://api.anthropic.com
  apiKey: ${ANTHROPIC_API_KEY:}
  model: claude-sonnet-4-5-20250929
  maxTokens: 1200

naverSearchAd:
  baseUrl: https://api.searchad.naver.com
  # Option A (legacy single credential):
  apiKey: ${NAVER_SEARCHAD_API_KEY:}
  apiSecret: ${NAVER_SEARCHAD_API_SECRET:}
  customerId: ${NAVER_SEARCHAD_CUSTOMER_ID:}
  # Option B (preferred pool; example):
  # credentials:
  #   - apiKey: ${NAVER_SEARCHAD_API_KEY_1}
  #     apiSecret: ${NAVER_SEARCHAD_API_SECRET_1}
  #     customerId: ${NAVER_SEARCHAD_CUSTOMER_ID_1}
  #   - apiKey: ${NAVER_SEARCHAD_API_KEY_2}
  #     apiSecret: ${NAVER_SEARCHAD_API_SECRET_2}
  #     customerId: ${NAVER_SEARCHAD_CUSTOMER_ID_2}
  perCredentialMaxInFlight: 8
  timezone: Asia/Seoul
  timeout: 5s

naverOpenApi:
  baseUrl: https://openapi.naver.com
  clientId: ${NAVER_OPENAPI_CLIENT_ID:}
  clientSecret: ${NAVER_OPENAPI_CLIENT_SECRET:}
  timezone: Asia/Seoul
